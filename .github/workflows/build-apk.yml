name: Build Nexus Videos Android APK

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Release Nexus Videos APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "gradle"

      - name: Install dependencies and build web bundle
        run: |
          npm install --no-audit --no-fund
          npx tsc --noEmit
          npx vite build
          npx cap sync android

      - name: Generate release keystore for consistent APK signing
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Nexus Videos,O=Nexus,C=IN"
          fi

      - name: Build Android APKs (Debug + Signed Release)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug assembleRelease --no-daemon --stacktrace

      - name: Prepare APK outputs
        run: |
          mkdir -p apk-out
          DEBUG_APK=$(find android/app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          RELEASE_APK=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          cp "$DEBUG_APK" apk-out/NexusVideos-v1.2.0-debug.apk
          cp "$RELEASE_APK" apk-out/NexusVideos-v1.2.0-release.apk
          ls -lh apk-out/
          sha256sum apk-out/*.apk

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nexus-videos-apk
          path: apk-out/*.apk
          retention-days: 30

      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v1.2.0"
          gh release delete "$TAG" --yes 2>/dev/null || true
          gh release create "$TAG" apk-out/NexusVideos-v1.2.0-release.apk apk-out/NexusVideos-v1.2.0-debug.apk \
            --title "Nexus Videos v1.2.0 (Android APK)" \
            --notes "Built with Capacitor 8, Three.js 3D Intro, Kids Mode PIN, AdMob Integration, Voice Mic & Fullscreen Video." \
            --latest
