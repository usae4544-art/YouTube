<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>Nexus Videos</title>
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <meta name="theme-color" content="#09090f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

<script>
(function () {
  var isStandaloneApp = Boolean(window.NexusAndroid || window.Capacitor || window.location.protocol === 'capacitor:');
  function sendClientLog(payload) {
    if (isStandaloneApp) return;
    try {
      fetch('/api/log_error', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      }).catch(function () {});
    } catch (e) {}
  }

  window.addEventListener('error', function(event) {
    if (event.message === 'Script error.' || (event.filename && event.filename.indexOf('effectivecpmnetwork') !== -1)) {
      event.preventDefault();
      event.stopImmediatePropagation();
      return;
    }
    sendClientLog({
      message: event.message,
      filename: event.filename,
      lineno: event.lineno,
      colno: event.colno,
      error: event.error ? event.error.stack : null
    });
  }, true);

  window.addEventListener('unhandledrejection', function(event) {
    if (event.reason && event.reason.message === 'Script error.') {
      event.preventDefault();
      event.stopImmediatePropagation();
      return;
    }
    sendClientLog({
      message: event.reason ? event.reason.message : 'unhandled rejection',
      error: event.reason ? event.reason.stack : null
    });
  }, true);
})();
</script>

</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
